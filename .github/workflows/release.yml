name: Build Grabbit Windows artifacts

# Manual artifact builds only. This workflow does not publish a release,
# contact upstream package repositories, or use telemetry credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.2'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build Windows artifacts
        run: bun run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BTBN_GITHUB_TOKEN: ${{ github.token }}
      - name: Scan packed output with Windows Defender
        shell: pwsh
        run: >-
          ./scripts/test-binaries/scan-windows-defender.ps1
          -Path dist/win-unpacked
          -Require Grabbit.exe,resources/ffmpeg.exe,resources/ffprobe.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Grabbit-Windows
          path: |
            dist/Grabbit-win-x64-Setup.exe
            dist/Grabbit-win-x64-Portable.exe
          if-no-files-found: error
